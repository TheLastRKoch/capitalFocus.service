<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Capital Focus</title>
    <link rel="icon" href="{{ url_for('static', filename='imgs/icon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='imgs/apple-icon.png') }}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
</head>

<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
        <div class="container-fluid px-4">
            <button class="btn btn-link text-dark p-0 me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenu">
                <i class="bi bi-list fs-3"></i>
            </button>
            <span class="navbar-brand fw-bold text-primary">Capital Focus</span>
            <div class="ms-auto d-flex align-items-center">
                <button class="btn btn-link text-dark p-0 position-relative">
                    <i class="bi bi-bell fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Side Menu -->
    <div class="offcanvas offcanvas-start border-0 shadow" tabindex="-1" id="sideMenu">
        <div class="offcanvas-header border-bottom px-4">
            <h5 class="offcanvas-title fw-bold">Navigation</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body px-4">
            <div class="list-group list-group-flush gap-2">
                <a href="{{ url_for('transactions.index') }}" class="list-group-item list-group-item-action border-0 rounded-3 py-3 active">
                    <i class="bi bi-grid-1x2 me-3"></i> Dashboard
                </a>
                <a href="{{ url_for('budgets.index') }}" class="list-group-item list-group-item-action border-0 rounded-3 py-3">
                    <i class="bi bi-wallet2 me-3"></i> Budgets
                </a>
                <a href="#" class="list-group-item list-group-item-action border-0 rounded-3 py-3">
                    <i class="bi bi-bar-chart me-3"></i> Reports
                </a>
                <a href="#" class="list-group-item list-group-item-action border-0 rounded-3 py-3">
                    <i class="bi bi-gear me-3"></i> Settings
                </a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container-fluid py-5 px-lg-5">
        <!-- Summary card -->
        <div class="row mb-5 fade-in">
            <div class="col-12 col-md-4">
                <div class="card summary-card shadow-sm border-0" style="--cf-primary: #ffc107;">
                    <div class="card-body p-4">
                        <span class="summary-label">Pending Transactions</span>
                        <span class="summary-value text-warning">...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="mb-5 fade-in" style="animation-delay: 0.1s;">
            <div class="input-group shadow-sm rounded-4 overflow-hidden" style="max-width: 600px;">
                <span class="input-group-text bg-white border-0 ps-4"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control border-0 py-3" placeholder="Search transactions...">
            </div>
        </div>

        <!-- Transaction Cards -->
        <div class="row g-4 fade-in" id="transactionList" style="animation-delay: 0.2s;">
            <div class="col-12 text-center py-5">
                <div class="spinner-grow text-primary" role="status">
                    <span class="visually-hidden">Loading transactions...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Transaction Categorization Modal -->
    <div class="modal fade" id="transactionModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold">Categorize Transaction</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="transactionForm" class="form-scroll">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Commerce</label>
                            <input type="text" class="form-control bg-light border-0" id="modalCommerce" readonly tabindex="-1">
                        </div>
                        <div class="row mb-4">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold">Date</label>
                                <input type="text" class="form-control bg-light border-0" id="modalDate" readonly tabindex="-1">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold">Amount</label>
                                <input type="text" class="form-control bg-light border-0" id="modalAmount" readonly tabindex="-1">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="budgetSelect" class="form-label fw-bold">Target Budget</label>
                            <select class="form-select border-0 bg-light" id="budgetSelect" required>
                                <option value="" selected disabled>Select a budget...</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="categorySelect" class="form-label fw-bold">Category</label>
                            <select class="form-select border-0 bg-light" id="categorySelect" required>
                                <option value="" selected disabled>Select a category...</option>
                            </select>
                        </div>

                        <div id="additionalDetails" class="d-none bg-light p-3 rounded-3 mb-3">
                            <div class="mb-2">
                                <label class="form-label text-muted small fw-bold mb-0">Location</label>
                                <p id="modalLocation" class="mb-0 small"></p>
                            </div>
                            <div>
                                <label class="form-label text-muted small fw-bold mb-0">Card Detail</label>
                                <p id="modalCard" class="mb-0 small"></p>
                            </div>
                        </div>
                        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none text-primary fw-bold" id="toggleDetails">Show More Details</button>
                    </form>
                </div>
                <div class="modal-footer border-0 p-4 pt-0 justify-content-between">
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-light rounded-circle shadow-sm" id="prevButton"><i class="bi bi-chevron-left"></i></button>
                        <button type="button" class="btn btn-light rounded-circle shadow-sm" id="nextButton"><i class="bi bi-chevron-right"></i></button>
                    </div>
                    <div>
                        <button type="button" class="btn btn-outline-danger border-0 rounded-pill px-3 me-2" id="deleteButton">Delete</button>
                        <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm" id="saveButton">Categorize</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & JS Modules -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/app.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/script.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/transactions/uncategorize.js') }}"></script>
</body>

</html>
