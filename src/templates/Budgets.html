<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgets - Capital Focus</title>
    <link rel="icon" href="../static/imgs/icon-light-32x32.png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="../static/imgs/icon-dark-32x32.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="../static/imgs/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../static/imgs/apple-icon.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>

<body>
    <!-- Header -->
    <nav class="navbar navbar-light bg-white border-bottom sticky-top">
        <div class="container-fluid">
            <button class="btn btn-link text-dark p-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sideMenu" aria-label="Open menu">
                <i class="bi bi-list fs-4"></i>
            </button>
            <span class="navbar-brand mb-0 h5 fw-semibold">Capital Focus</span>
            <button class="btn btn-link text-dark p-0 position-relative" aria-label="Notifications">
                <i class="bi bi-bell fs-5"></i>
            </button>
        </div>
    </nav>

    <!-- Side Menu Offcanvas -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sideMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="UncategorizeItems.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="Categories.html">Categories</a></li>
                <li class="nav-item"><a class="nav-link active" href="Budgets.html">Budgets</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Reports</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container-fluid py-4 bg-light min-vh-100">
        <!-- Floating Add Button -->
        <button class="btn btn-primary rounded-circle fab-button shadow" data-bs-toggle="modal"
            data-bs-target="#addBudgetModal">
            <i class="bi bi-plus-lg"></i>
        </button>

        <!-- Summary card -->
        <div class="card summary-card shadow-sm mb-4" style="max-width: 400px;">
            <div class="card-body p-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h6 class="text-muted fw-bold mb-0">BUDGETS OVERVIEW</h6>
                </div>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="summary-item bg-primary-subtle">
                            <span class="summary-label">Active</span>
                            <span class="summary-value text-primary">12</span>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="summary-item bg-secondary-subtle">
                            <span class="summary-label">Inactive</span>
                            <span class="summary-value text-secondary">2</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="mb-4">
            <div class="input-group shadow-sm rounded-3 overflow-hidden" style="max-width: 500px;">
                <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control border-0 py-2" placeholder="Search budgets..."
                    aria-label="Search">
            </div>
        </div>

        <!-- Accordion Budgets -->
        <div class="accordion" id="budgetsAccordion">
            <!-- Active Budgets Section -->
            <div class="card mb-3 border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <button
                            class="btn btn-link text-dark text-decoration-none p-0 d-flex align-items-center gap-3 accordion-toggle"
                            data-bs-toggle="collapse" data-bs-target="#activeBudgets">
                            <i class="bi bi-chevron-down accordion-chevron"></i>
                            <span class="fw-medium">Active Budgets</span>
                        </button>
                    </div>
                </div>
                <div id="activeBudgets" class="collapse show">
                    <div class="card-body pt-0">
                        <div class="list-group list-group-flush">
                            <div
                                class="list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-0 border-bottom">
                                <div>
                                    <h6 class="mb-0 fw-semibold">January 2026</h6>
                                    <small class="text-muted">Current Budget</small>
                                </div>
                                <div class="d-flex gap-2">
                                    <li class="btn btn-outline-primary btn-sm rounded-pill px-3"><a class="nav-link" href="BudgetDescription.html">View</a></li>
                                    <button class="btn btn-outline-secondary btn-sm rounded-pill" data-bs-toggle="modal"
                                        data-bs-target="#editBudgetModal">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                </div>
                            </div>
                            <div
                                class="list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-0 border-bottom">
                                <div>
                                    <h6 class="mb-0 fw-semibold">February 2026</h6>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-primary btn-sm rounded-pill px-3">View</button>
                                    <button class="btn btn-outline-secondary btn-sm rounded-pill" data-bs-toggle="modal"
                                        data-bs-target="#editBudgetModal">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                </div>
                            </div>
                            <div
                                class="list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-0">
                                <div>
                                    <h6 class="mb-0 fw-semibold">March 2026</h6>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-primary btn-sm rounded-pill px-3">View</button>
                                    <button class="btn btn-outline-secondary btn-sm rounded-pill" data-bs-toggle="modal"
                                        data-bs-target="#editBudgetModal">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Inactive Budgets Section -->
            <div class="card mb-3 border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <button
                            class="btn btn-link text-dark text-decoration-none p-0 d-flex align-items-center gap-3 accordion-toggle collapsed"
                            data-bs-toggle="collapse" data-bs-target="#inactiveBudgets">
                            <i class="bi bi-chevron-down accordion-chevron"></i>
                            <span class="fw-medium">Inactive Budgets</span>
                        </button>
                    </div>
                </div>
                <div id="inactiveBudgets" class="collapse">
                    <div class="card-body pt-0">
                        <div class="list-group list-group-flush">
                            <div
                                class="list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-0">
                                <div>
                                    <h6 class="mb-0 fw-semibold">December 2025</h6>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-primary btn-sm rounded-pill px-3">View</button>
                                    <button class="btn btn-outline-secondary btn-sm rounded-pill" data-bs-toggle="modal"
                                        data-bs-target="#editBudgetModal">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- New Budget Modal -->
    <div class="modal fade" id="addBudgetModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Budget</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addBudgetForm">
                        <div class="mb-3">
                            <label for="budgetName" class="form-label">Budget Month/Year</label>
                            <input type="month" class="form-control" id="budgetName" required>
                        </div>
                        <div class="mb-3">
                            <label for="initialSalary" class="form-label">Budget projection</label>
                            <input type="number" class="form-control" id="initialSalary" placeholder="0.00">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Create Budget</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Budget Modal -->
    <div class="modal fade" id="editBudgetModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Budget</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editBudgetForm">
                        <div class="mb-3">
                            <label for="budgetName" class="form-label">Budget Title</label>
                            <input type="text" class="form-control" id="budgetName" required>
                        </div>
                        <div class="mb-3">
                            <label for="initialSalary" class="form-label">Budget projection</label>
                            <input type="number" class="form-control" id="initialSalary" placeholder="0.00">
                        </div>
                        <div class="mb-3">
                            <label for="initialSalary" class="form-label">Status</label>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch"
                                    id="flexSwitchCheckChecked" checked>
                                <label class="form-check-label" for="flexSwitchCheckChecked">Active
                                    input</label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../static/scripts/script.js"></script>
</body>

</html>
