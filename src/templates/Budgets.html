<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Details Modal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
  <style>
    .form-scroll {
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <nav class="navbar navbar-light bg-white border-bottom sticky-top">
    <div class="container-fluid">
      <button class="btn btn-link text-dark p-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenu"
        aria-label="Open menu">
        <i class="bi bi-list fs-4"></i>
      </button>
      <span class="navbar-brand mb-0 h5 fw-semibold">Capital Focus</span>
      <button class="btn btn-link text-dark p-0 position-relative" aria-label="Notifications">
        <i class="bi bi-bell fs-5"></i>
      </button>
    </div>
  </nav>

  <!-- Side Menu Offcanvas -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="sideMenu">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="Uncategorized.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="Categories.html">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Reports</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
      </ul>
    </div>
  </div>

  <div class="container mt-5">
    <!-- <button id="openModalBtn" class="btn btn-primary">Open Transaction Details</button> -->

    <div class="jumbotron jumbotron-fluid">
      <div class="container">
        <h1 class="display-4">Active budgets</h1>
        <p class="lead">12</p>
        <h1 class="display-4">Inactive budgets</h1>
        <p class="lead">2</p>
      </div>
    </div>


    <form class="form-inline">
      <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
      <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
    </form>

    <div id="accordion">
      <div class="card">
        <div class="card-header" id="headingOne">
          <h5 class="mb-0">
            <button class="btn btn-link" data-toggle="collapse" data-target="#collapseOne" aria-expanded="true"
              aria-controls="collapseOne">
              Active
            </button>
          </h5>
        </div>

        <div id="collapseOne" class="collapse show" aria-labelledby="headingOne" data-parent="#accordion">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">January 2026</h5>
              <button id="openModalBtn" class="btn btn-primary">View</button>
              <button id="openModalBtn" class="btn btn-danger">Delete</button>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">February 2026</h5>
              <button id="openModalBtn" class="btn btn-primary">View</button>
              <button id="openModalBtn" class="btn btn-danger">Delete</button>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">March 2026</h5>
              <button id="openModalBtn" class="btn btn-primary">View</button>
              <button id="openModalBtn" class="btn btn-danger">Delete</button>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header" id="headingTwo">
          <h5 class="mb-0">
            <button class="btn btn-link collapsed" data-toggle="collapse" data-target="#collapseTwo"
              aria-expanded="false" aria-controls="collapseTwo">
              Inactive
            </button>
          </h5>
        </div>
        <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordion">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">December 2025</h5>
              <button id="openModalBtn" class="btn btn-primary">View</button>
              <button id="openModalBtn" class="btn btn-danger">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>




  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../static/scripts/script.js"></script>

</body>

</html>
