<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgets - Capital Focus</title>
    <link rel="icon" href="{{ url_for('static', filename='imgs/icon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='imgs/apple-icon.png') }}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
</head>

<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
        <div class="container-fluid px-4">
            <button class="btn btn-link text-dark p-0 me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenu">
                <i class="bi bi-list fs-3"></i>
            </button>
            <span class="navbar-brand fw-bold text-primary">Capital Focus</span>
            <div class="ms-auto d-flex align-items-center">
                <button class="btn btn-link text-dark p-0 position-relative">
                    <i class="bi bi-bell fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Side Menu -->
    <div class="offcanvas offcanvas-start border-0 shadow" tabindex="-1" id="sideMenu">
        <div class="offcanvas-header border-bottom px-4">
            <h5 class="offcanvas-title fw-bold">Navigation</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body px-4">
            <div class="list-group list-group-flush gap-2">
                <a href="{{ url_for('transactions.index') }}" class="list-group-item list-group-item-action border-0 rounded-3 py-3">
                    <i class="bi bi-grid-1x2 me-3"></i> Dashboard
                </a>
                <a href="{{ url_for('budgets.index') }}" class="list-group-item list-group-item-action border-0 rounded-3 py-3 active">
                    <i class="bi bi-wallet2 me-3"></i> Budgets
                </a>
                <a href="#" class="list-group-item list-group-item-action border-0 rounded-3 py-3">
                    <i class="bi bi-bar-chart me-3"></i> Reports
                </a>
                <a href="#" class="list-group-item list-group-item-action border-0 rounded-3 py-3">
                    <i class="bi bi-gear me-3"></i> Settings
                </a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container-fluid py-5 px-lg-5">
        <!-- FAB -->
        <button class="btn btn-primary rounded-circle fab-button shadow-lg" data-bs-toggle="modal" data-bs-target="#addBudgetModal">
            <i class="bi bi-plus-lg"></i>
        </button>

        <!-- Page Header -->
        <div class="mb-5 fade-in">
            <h2 class="fw-bold mb-0">Budgets Management</h2>
            <p class="text-muted">Track and organize your monthly financial projections.</p>
        </div>

        <!-- Overview Cards -->
        <div class="row g-4 mb-5 fade-in" style="animation-delay: 0.1s;">
            <div class="col-12 col-md-3">
                <div class="card summary-card shadow-sm border-0">
                    <div class="card-body p-4">
                        <span class="summary-label">Active Budgets</span>
                        <span id="activeCount" class="summary-value text-primary">0</span>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="card summary-card shadow-sm border-0" style="--cf-primary: #6c757d;">
                    <div class="card-body p-4">
                        <span class="summary-label">Inactive Budgets</span>
                        <span id="inactiveCount" class="summary-value text-secondary">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="mb-5 fade-in" style="animation-delay: 0.2s;">
            <div class="input-group shadow-sm rounded-4 overflow-hidden" style="max-width: 600px;">
                <span class="input-group-text bg-white border-0 ps-4"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control border-0 py-3" placeholder="Search budgets by name or month...">
            </div>
        </div>

        <!-- Budgets Grid -->
        <div class="fade-in" style="animation-delay: 0.3s;">
            <div class="d-flex align-items-center mb-4">
                <h5 class="fw-bold mb-0">Active Budgets</h5>
                <hr class="flex-grow-1 ms-4 opacity-10">
            </div>
            <div class="row g-4 mb-5" id="activeBudgetsList">
                <div class="col-12 text-center py-5">
                    <div class="spinner-grow text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="d-flex align-items-center mb-4">
                <h5 class="fw-bold mb-0 text-muted">Inactive Budgets</h5>
                <hr class="flex-grow-1 ms-4 opacity-10">
            </div>
            <div class="row g-4" id="inactiveBudgetsList">
                <div class="col-12 text-center py-5">
                    <div class="spinner-grow text-secondary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- New Budget Modal -->
    <div class="modal fade" id="addBudgetModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold">New Budget</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addBudgetForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">BUDGET MONTH/YEAR</label>
                            <input type="month" class="form-control bg-light border-0" id="budgetName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">BUDGET PROJECTION</label>
                            <input type="number" class="form-control bg-light border-0" id="initialSalary" placeholder="0.00" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="addBudgetForm" class="btn btn-primary rounded-pill px-4 shadow-sm">Create Budget</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Budget Modal -->
    <div class="modal fade" id="editBudgetModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold">Edit Budget</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="editBudgetForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">BUDGET TITLE</label>
                            <input type="text" class="form-control bg-light border-0" id="editBudgetName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">BUDGET PROJECTION</label>
                            <input type="number" class="form-control bg-light border-0" id="editInitialSalary" placeholder="0.00" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">STATUS</label>
                            <div class="form-check form-switch p-0 ms-4 mt-2">
                                <input class="form-check-input" type="checkbox" role="switch" id="statusSwitch">
                                <label class="form-check-label ms-2" for="statusSwitch">Active</label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="editBudgetForm" class="btn btn-primary rounded-pill px-4 shadow-sm">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & JS Modules -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/app.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/script.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/budgets/list.js') }}"></script>
</body>

</html>
