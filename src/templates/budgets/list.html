<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgets - Capital Focus</title>
    <link rel="icon" href="{{ url_for('static', filename='imgs/icon-light-32x32.png') }}" media="(prefers-color-scheme: light)">
    <link rel="icon" href="{{ url_for('static', filename='imgs/icon-dark-32x32.png') }}" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{{ url_for('static', filename='imgs/icon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='imgs/apple-icon.png') }}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
    <style>
        .budget-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .budget-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08) !important;
        }
    </style>
</head>

<body>
    <!-- Header (Heuristic 4: Consistency and standards) -->
    <nav class="navbar navbar-light bg-white border-bottom sticky-top">
        <div class="container-fluid">
            <button class="btn btn-link text-dark p-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sideMenu" aria-label="Open menu">
                <i class="bi bi-list fs-4"></i>
            </button>
            <span class="navbar-brand mb-0 h5 fw-semibold">Capital Focus</span>
            <button class="btn btn-link text-dark p-0 position-relative" aria-label="Notifications">
                <i class="bi bi-bell fs-5"></i>
            </button>
        </div>
    </nav>

    <!-- Side Menu Offcanvas (Heuristic 3: User control and freedom) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sideMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-dark" href="{{ url_for('transactions.index') }}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active text-primary fw-bold" href="{{ url_for('budgets.index') }}">Budgets</a></li>
                <li class="nav-item"><a class="nav-link text-dark" href="#">Reports</a></li>
                <li class="nav-item"><a class="nav-link text-dark" href="#">Settings</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container-fluid py-4 bg-light min-vh-100">
        <!-- Floating Add Button (Heuristic 7: Flexibility and efficiency of use) -->
        <button class="btn btn-primary rounded-circle fab-button shadow" data-bs-toggle="modal"
            data-bs-target="#addBudgetModal" title="Add New Budget">
            <i class="bi bi-plus-lg"></i>
        </button>

        <!-- Summary card (Heuristic 1: Visibility of system status) -->
        <div class="card summary-card shadow-sm mb-4" style="max-width: 400px;">
            <div class="card-body p-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h6 class="text-muted fw-bold mb-0">BUDGETS OVERVIEW</h6>
                </div>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="summary-item bg-primary-subtle">
                            <span class="summary-label">Active</span>
                            <span id="activeCount" class="summary-value text-primary">0</span>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="summary-item bg-secondary-subtle">
                            <span class="summary-label">Inactive</span>
                            <span id="inactiveCount" class="summary-value text-secondary">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Bar (Heuristic 7: Flexibility and efficiency of use) -->
        <div class="mb-4">
            <div class="input-group shadow-sm rounded-3 overflow-hidden" style="max-width: 500px;">
                <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control border-0 py-2" placeholder="Search budgets..."
                    aria-label="Search">
            </div>
        </div>

        <!-- Budgets Grid (Heuristic 8: Aesthetic and minimalist design) -->
        <h5 class="fw-bold mb-3">Active Budgets</h5>
        <div class="row g-3 mb-5" id="activeBudgetsList">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading active budgets...</span>
                </div>
            </div>
        </div>

        <h5 class="fw-bold mb-3 text-muted">Inactive Budgets</h5>
        <div class="row g-3" id="inactiveBudgetsList">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-secondary" role="status">
                    <span class="visually-hidden">Loading inactive budgets...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- New Budget Modal (Heuristic 5: Error prevention) -->
    <div class="modal fade" id="addBudgetModal" tabindex="-1" aria-labelledby="addBudgetModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="addBudgetModalLabel">New Budget</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addBudgetForm">
                        <div class="mb-3">
                            <label for="budgetName" class="form-label text-muted small fw-bold">BUDGET MONTH/YEAR</label>
                            <input type="month" class="form-control bg-light border-0" id="budgetName" required>
                        </div>
                        <div class="mb-3">
                            <label for="initialSalary" class="form-label text-muted small fw-bold">BUDGET PROJECTION</label>
                            <input type="number" class="form-control bg-light border-0" id="initialSalary" placeholder="0.00" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="addBudgetForm" class="btn btn-primary rounded-pill px-4 shadow-sm">Create Budget</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Budget Modal (Heuristic 3: User control and freedom) -->
    <div class="modal fade" id="editBudgetModal" tabindex="-1" aria-labelledby="editBudgetModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="editBudgetModalLabel">Edit Budget</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editBudgetForm">
                        <div class="mb-3">
                            <label for="editBudgetName" class="form-label text-muted small fw-bold">BUDGET TITLE</label>
                            <input type="text" class="form-control bg-light border-0" id="editBudgetName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editInitialSalary" class="form-label text-muted small fw-bold">BUDGET PROJECTION</label>
                            <input type="number" class="form-control bg-light border-0" id="editInitialSalary" placeholder="0.00" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">STATUS</label>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch"
                                    id="statusSwitch">
                                <label class="form-check-label" for="statusSwitch">Active</label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="editBudgetForm" class="btn btn-primary rounded-pill px-4 shadow-sm">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/budgets/list.js') }}"></script>
</body>

</html>
