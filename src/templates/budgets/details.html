<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Details - Capital Focus</title>
    <link rel="icon" href="{{ url_for('static', filename='imgs/icon-light-32x32.png') }}" media="(prefers-color-scheme: light)">
    <link rel="icon" href="{{ url_for('static', filename='imgs/icon-dark-32x32.png') }}" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{{ url_for('static', filename='imgs/icon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='imgs/apple-icon.png') }}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
</head>

<body>
    <!-- Header (Heuristic 4: Consistency and standards) -->
    <nav class="navbar navbar-light bg-white border-bottom sticky-top">
        <div class="container-fluid">
            <button class="btn btn-link text-dark p-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sideMenu" aria-label="Open menu">
                <i class="bi bi-list fs-4"></i>
            </button>
            <span class="navbar-brand mb-0 h5 fw-semibold">Capital Focus</span>
            <button class="btn btn-link text-dark p-0 position-relative" aria-label="Notifications">
                <i class="bi bi-bell fs-5"></i>
            </button>
        </div>
    </nav>

    <!-- Side Menu Offcanvas (Heuristic 3: User control and freedom) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sideMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-dark" href="{{ url_for('transactions.index') }}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-dark" href="{{ url_for('budgets.index') }}">Budgets</a></li>
                <li class="nav-item"><a class="nav-link active text-primary fw-bold" href="{{ url_for('budgets.budget_details') }}">Current Budget</a></li>
                <li class="nav-item"><a class="nav-link text-dark" href="#">Reports</a></li>
                <li class="nav-item"><a class="nav-link text-dark" href="#">Settings</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container-fluid py-4 bg-light min-vh-100">
        <!-- Floating Add Button (Heuristic 7: Flexibility and efficiency of use) -->
        <button class="btn btn-primary rounded-circle fab-button shadow" data-bs-toggle="modal"
            data-bs-target="#addCategoryModal" title="Add New Category">
            <i class="bi bi-plus-lg"></i>
        </button>

        <!-- Page Title & Navigation (Heuristic 3: User control and freedom) -->
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('budgets.index') }}" class="btn btn-link text-dark p-0 me-3 shadow-none" title="Back to Budgets"><i class="bi bi-arrow-left fs-4"></i></a>
            <div>
                <h4 class="fw-bold mb-0" id="budgetTitle">Loading...</h4>
                <small class="text-muted">Budget Details</small>
            </div>
        </div>

        <!-- Summary card (Heuristic 1: Visibility of system status) -->
        <div class="card summary-card shadow-sm mb-4" style="max-width: 400px;">
            <div class="card-body p-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h6 class="text-muted fw-bold mb-0">OVERVIEW</h6>
                    <button class="btn btn-light edit-summary-btn rounded-circle" id="btnEditSummary" data-bs-toggle="modal"
                        data-bs-target="#editSummary" aria-label="Edit Summary" title="Edit Budget Overview">
                        <i class="bi bi-pencil-fill fs-6"></i>
                    </button>
                </div>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="summary-item bg-primary-subtle">
                            <span class="summary-label">Projection</span>
                            <span id="projectionValue" class="summary-value salary-value text-primary">0</span>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="summary-item bg-success-subtle">
                            <span class="summary-label">Available</span>
                            <span id="availableValue" class="summary-value text-success">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Accordion Categories (Heuristic 8: Aesthetic and minimalist design) -->
        <div class="accordion" id="categoriesAccordion">
            <div class="text-center py-5" id="categoriesLoader">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading categories...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Category Modal -->
    <div class="modal fade" id="editCategoryModal" tabindex="-1" aria-labelledby="editCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="editCategoryModalLabel">Edit Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editCategoryForm">
                        <div class="mb-3">
                            <label for="editCategoryName" class="form-label text-muted small fw-bold">CATEGORY NAME</label>
                            <input type="text" class="form-control bg-light border-0" id="editCategoryName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editCategoryBudget" class="form-label text-muted small fw-bold">BUDGET</label>
                            <input type="number" class="form-control bg-light border-0" id="editCategoryBudget" placeholder="0.00" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="editCategoryForm" class="btn btn-primary rounded-pill px-4 shadow-sm" id="saveEditCategoryBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Category Modal -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="addCategoryModalLabel">New Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addCategoryForm">
                        <div class="mb-3">
                            <label for="newCategoryName" class="form-label text-muted small fw-bold">CATEGORY NAME</label>
                            <input type="text" class="form-control bg-light border-0" id="newCategoryName" required>
                        </div>
                        <div class="mb-3">
                            <label for="newCategoryBudget" class="form-label text-muted small fw-bold">BUDGET</label>
                            <input type="number" class="form-control bg-light border-0" id="newCategoryBudget" placeholder="0.00" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="addCategoryForm" class="btn btn-primary rounded-pill px-4 shadow-sm" id="saveNewCategoryBtn">Create Category</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Summary Modal -->
    <div class="modal fade" id="editSummary" tabindex="-1" aria-labelledby="editSummaryLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="editSummaryLabel">Edit Summary</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editSummaryForm">
                        <div class="mb-3">
                            <label for="summarySalary" class="form-label text-muted small fw-bold">PROJECTION</label>
                            <input type="number" class="form-control bg-light border-0" id="summarySalary" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="editSummaryForm" class="btn btn-primary rounded-pill px-4 shadow-sm" id="saveSummaryBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/budgets/details.js') }}"></script>
</body>

</html>
