<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Details - Capital Focus</title>
    <link rel="icon" href="{{ url_for('static', filename='imgs/icon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='imgs/apple-icon.png') }}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
</head>

<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
        <div class="container-fluid px-4">
            <button class="btn btn-link text-dark p-0 me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenu">
                <i class="bi bi-list fs-3"></i>
            </button>
            <span class="navbar-brand fw-bold text-primary">Capital Focus</span>
            <div class="ms-auto d-flex align-items-center">
                <button class="btn btn-link text-dark p-0 position-relative">
                    <i class="bi bi-bell fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Side Menu -->
    <div class="offcanvas offcanvas-start border-0 shadow" tabindex="-1" id="sideMenu">
        <div class="offcanvas-header border-bottom px-4">
            <h5 class="offcanvas-title fw-bold">Navigation</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body px-4">
            <div class="list-group list-group-flush gap-2">
                <a href="{{ url_for('transactions.index') }}" class="list-group-item list-group-item-action border-0 rounded-3 py-3">
                    <i class="bi bi-grid-1x2 me-3"></i> Dashboard
                </a>
                <a href="{{ url_for('budgets.index') }}" class="list-group-item list-group-item-action border-0 rounded-3 py-3 active">
                    <i class="bi bi-wallet2 me-3"></i> Budgets
                </a>
                <a href="#" class="list-group-item list-group-item-action border-0 rounded-3 py-3">
                    <i class="bi bi-bar-chart me-3"></i> Reports
                </a>
                <a href="#" class="list-group-item list-group-item-action border-0 rounded-3 py-3">
                    <i class="bi bi-gear me-3"></i> Settings
                </a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container-fluid py-5 px-lg-5">
        <!-- FAB -->
        <button class="btn btn-primary rounded-circle fab-button shadow-lg" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
            <i class="bi bi-plus-lg"></i>
        </button>

        <!-- Page Header -->
        <div class="d-flex align-items-center mb-5 fade-in">
            <a href="{{ url_for('budgets.index') }}" class="btn btn-outline-dark btn-sm rounded-circle me-4 shadow-sm" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-arrow-left fs-5"></i>
            </a>
            <div>
                <h2 class="fw-bold mb-0" id="budgetTitle">Loading...</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="{{ url_for('budgets.index') }}" class="text-decoration-none text-muted">Budgets</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Details</li>
                    </ol>
                </nav>
            </div>
            <div class="ms-auto">
                <button type="button" id="refreshSections" class="btn btn-white border shadow-sm rounded-pill px-4">
                    <i class="bi bi-arrow-clockwise me-2"></i> Refresh
                </button>
            </div>
        </div>

        <!-- Overview Cards -->
        <div class="row g-4 mb-5 fade-in" style="animation-delay: 0.1s;">
            <div class="col-12 col-md-4">
                <div class="card summary-card shadow-sm h-100 border-0">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="summary-label">Total Projection</span>
                            <button class="btn btn-light btn-sm rounded-circle" data-bs-toggle="modal" data-bs-target="#editSummary">
                                <i class="bi bi-pencil-fill"></i>
                            </button>
                        </div>
                        <span id="projectionValue" class="summary-value text-primary">0</span>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card summary-card shadow-sm h-100 border-0" style="--cf-primary: #0dcaf0;">
                    <div class="card-body p-4">
                        <span class="summary-label">Available for Alloc</span>
                        <span id="remainingValue" class="summary-value text-info">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sections Container -->
        <div id="categoriesAccordion" class="fade-in" style="animation-delay: 0.2s;">
            <!-- Loader -->
            <div class="text-center py-5" id="categoriesLoader">
                <div class="spinner-grow text-primary" role="status">
                    <span class="visually-hidden">Loading sections...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Category Modal -->
    <div class="modal fade" id="editCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold">Edit Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="editCategoryForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">CATEGORY NAME</label>
                            <input type="text" class="form-control bg-light border-0" id="editCategoryName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">BUDGET</label>
                            <input type="number" class="form-control bg-light border-0" id="editCategoryBudget" placeholder="0.00" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="editCategoryForm" class="btn btn-primary rounded-pill px-4 shadow-sm" id="saveEditCategoryBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Category Modal -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold">New Section</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addCategoryForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">SECTION NAME</label>
                            <input type="text" class="form-control bg-light border-0" id="newCategoryName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">PROJECTION</label>
                            <input type="number" class="form-control bg-light border-0" id="newCategoryBudget" placeholder="0.00" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="addCategoryForm" class="btn btn-primary rounded-pill px-4 shadow-sm" id="saveNewCategoryBtn">Save Section</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Summary Modal -->
    <div class="modal fade" id="editSummary" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold">Edit Summary</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="editSummaryForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">PROJECTION</label>
                            <input type="number" class="form-control bg-light border-0" id="summarySalary" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="editSummaryForm" class="btn btn-primary rounded-pill px-4 shadow-sm" id="saveSummaryBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & JS Modules -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/app.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/script.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='scripts/budgets/details.js') }}"></script>
</body>

</html>
