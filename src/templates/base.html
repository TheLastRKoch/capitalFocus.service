{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Capital Focus{% endblock %}</title>
    <link rel="icon" href="{% static 'imgs/icon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'imgs/apple-icon.png' %}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
        <div class="container-fluid px-4">
            <button class="btn btn-link text-dark p-0 me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenu">
                <i class="bi bi-list fs-3"></i>
            </button>
            <span class="navbar-brand fw-bold text-primary">Capital Focus</span>
            <div class="ms-auto d-flex align-items-center">
                <button class="btn btn-link text-dark p-0 position-relative">
                    <i class="bi bi-bell fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Side Menu -->
    <div class="offcanvas offcanvas-start border-0 shadow" tabindex="-1" id="sideMenu">
        <div class="offcanvas-header border-bottom px-4">
            <h5 class="offcanvas-title fw-bold">Navigation</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body px-4">
            <div class="list-group list-group-flush gap-2">
                <a href="{% url 'transactions:index' %}" class="list-group-item list-group-item-action border-0 rounded-3 py-3 disabled">
                    <i class="bi bi-grid-1x2 me-3"></i> Dashboard
                </a>
                <a href="{% url 'budgets:index' %}" class="list-group-item list-group-item-action border-0 rounded-3 py-3 {% if active_page == 'budgets' %}active{% endif %}">
                    <i class="bi bi-wallet2 me-3"></i> Budgets
                </a>
                <!-- Transactions with Sub-items -->
                <div class="list-group list-group-flush">
                    <button class="list-group-item list-group-item-action border-0 rounded-3 py-3 d-flex justify-content-between align-items-center {% if active_page == 'transactions' %}active{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#transactionsSubmenu">
                        <span><i class="bi bi-receipt me-3"></i> Transactions</span>
                        <i class="bi bi-chevron-down"></i>
                    </button>
                    <div class="collapse {% if active_page == 'transactions' %}show{% endif %}" id="transactionsSubmenu">
                        <div class="list-group list-group-flush ms-4 gap-2">
                            <a href="{% url 'transactions:index' %}" class="list-group-item list-group-item-action border-0 rounded-3 py-2">
                                <i class="bi bi-receipt me-3"></i> All Transactions
                            </a>
                            <a href="{% url 'transactions:import' %}" class="list-group-item list-group-item-action border-0 rounded-3 py-2">
                                <i class="bi bi-upload me-3"></i> Import
                            </a>
                            <a href="{% url 'transactions:uncategorize' %}" class="list-group-item list-group-item-action border-0 rounded-3 py-2">
                                <i class="bi bi-tags me-3"></i> Uncategorize
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container-fluid py-5 px-lg-5">
        {% block content %}{% endblock %}
    </main>

    {% block modals %}{% endblock %}

    <!-- Bootstrap & JS Modules -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="{% static 'scripts/app.js' %}"></script>
    <script type="module" src="{% static 'scripts/script.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
