services:
  service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "9003:8080"
    env_file:
      - ../.env
    volumes:
      - ../src:/app/src
    networks:
      - rklan

  db:
    image: postgres:latest
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    networks:
      - rklan

volumes:
  postgres_data:

networks:
  rklan:
    driver: bridge